<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>ORF Generator</title>
	<style>
		:root {
			--bg-1: #07111f;
			--bg-2: #0f172a;
			--card: rgba(15, 23, 42, 0.8);
			--card-border: rgba(148, 163, 184, 0.2);
			--text: #e2e8f0;
			--muted: #a8b3c7;
			--accent: #7dd3fc;
			--accent-2: #a78bfa;
			--danger: #f87171;
			--shadow: 0 20px 60px rgba(15, 23, 42, 0.45);
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-height: 100vh;
			font-family: Arial, Helvetica, sans-serif;
			line-height: 1.4;
			color: var(--text);
			display: grid;
			place-items: center;
			padding: 2rem;
			background:
				radial-gradient(circle at top left, rgba(125, 211, 252, 0.15), transparent 28%),
				radial-gradient(circle at bottom right, rgba(167, 139, 250, 0.18), transparent 30%),
				linear-gradient(135deg, var(--bg-1), var(--bg-2));
		}

		.container {
			width: min(560px, 100%);
			background: linear-gradient(180deg, rgba(15, 23, 42, 0.92), rgba(15, 23, 42, 0.7));
			border: 1px solid var(--card-border);
			border-radius: 20px;
			padding: 2rem;
			box-shadow: var(--shadow);
		}

		h1 {
			margin: 0 0 0.8rem;
			font-size: clamp(2rem, 3vw, 2.7rem);
			letter-spacing: -0.04em;
		}

		.note {
			font-size: 0.92rem;
			color: var(--muted);
			margin: 0 0 1.2rem;
			line-height: 1.6;
		}

		code {
			background: rgba(125, 211, 252, 0.12);
			padding: 0.12rem 0.38rem;
			border-radius: 6px;
			color: var(--accent);
			font-family: Consolas, Monaco, monospace;
		}

		form {
			display: grid;
			gap: 1rem;
			margin-top: 1rem;
		}

		label {
			display: block;
			font-weight: 700;
			margin-bottom: 0.45rem;
			color: var(--text);
		}

		input, select, button {
			font-size: 1rem;
			width: 100%;
			box-sizing: border-box;
			padding: 0.8rem 0.9rem;
			border-radius: 12px;
			border: 1px solid rgba(148, 163, 184, 0.2);
			background: rgba(15, 23, 42, 0.75);
			color: var(--text);
		}

		input:focus, select:focus {
			outline: none;
			border-color: rgba(125, 211, 252, 0.6);
			box-shadow: 0 0 0 3px rgba(125, 211, 252, 0.15);
		}

		button {
			cursor: pointer;
			border: 0;
			background: linear-gradient(135deg, var(--accent), var(--accent-2));
			color: #081421;
			font-weight: 800;
			letter-spacing: 0.02em;
			transition: transform 0.18s ease, box-shadow 0.18s ease;
			box-shadow: 0 10px 30px rgba(125, 211, 252, 0.3);
		}

		button:hover {
			transform: translateY(-1px);
		}

		.helper {
			font-size: 0.82rem;
			color: var(--muted);
			min-height: 1.2rem;
			margin-top: 0.4rem;
		}

		.helper.error {
			color: var(--danger);
			font-weight: 700;
		}

		.invalid {
			border: 2px solid var(--danger);
			box-shadow: 0 0 0 2px rgba(248, 113, 113, 0.15);
		}

		.error {
			color: var(--danger);
			font-weight: 700;
			min-height: 1.2rem;
		}
	</style>
</head>
<body>
	<div class="container">
		<h1>ORF Sequence Generator</h1>
		<p class="note">Generate sequences that start with <code>atg</code>, end with <code>taa</code>, and avoid internal <code>taa</code> codons.</p>

		<form id="orfForm">
			<div>
				<label for="numSequences">Number of sequences</label>
				<input id="numSequences" type="number" min="1" step="1" required />
			</div>

			<div>
				<label for="seqLength">Sequence length (must be divisible by 3)</label>
				<input id="seqLength" type="number" min="9" step="3" required aria-describedby="seqLengthHelp" />
				<div id="seqLengthHelp" class="helper" aria-live="polite">Minimum sequence length is 9.</div>
			</div>

			<div>
				<label for="prefix">Sequence name prefix (optional)</label>
				<input id="prefix" type="text" placeholder="sequence_" aria-describedby="prefixHelp" />
				<div id="prefixHelp" class="helper">Leave blank to use the default prefix: sequence_</div>
			</div>

			<div>
				<label for="format">Output format</label>
				<select id="format" required>
					<option value="csv">.csv</option>
					<option value="fa">.fa (FASTA)</option>
				</select>
			</div>

			<button type="submit">Generate & Download</button>
			<div id="error" class="error" aria-live="polite"></div>
		</form>
	</div>

	<script>
		(function () {
			const form = document.getElementById('orfForm');
			const errorEl = document.getElementById('error');
			const seqLengthInput = document.getElementById('seqLength');
			const seqLengthHelp = document.getElementById('seqLengthHelp');
			const nucleotides = ['a', 't', 'c', 'g'];

			function setSeqLengthValidation(message, isInvalid) {
				seqLengthInput.classList.toggle('invalid', isInvalid);
				seqLengthHelp.textContent = message;
				seqLengthHelp.classList.toggle('error', isInvalid);
			}

			function validateSeqLength(value) {
				if (value === '') {
					setSeqLengthValidation('Minimum sequence length is 9.', false);
					return false;
				}

				const intValue = Number(value);
				if (!Number.isInteger(intValue) || intValue < 9 || intValue % 3 !== 0) {
					setSeqLengthValidation(`Sequence length must be a multiple of 3 and at least 9. Minimum sequence length is 9.`, true);
					return false;
				}

				setSeqLengthValidation('Valid sequence length.', false);
				return true;
			}

			function randomCodon() {
				let codon = '';
				for (let i = 0; i < 3; i++) {
					codon += nucleotides[Math.floor(Math.random() * nucleotides.length)];
				}
				return codon;
			}

			function generateORF(length) {
				const codonCount = length / 3;
				const middleCount = codonCount - 2;
				const codons = ['atg'];

				for (let i = 0; i < middleCount; i++) {
					let c = randomCodon();
					while (c === 'taa' || c === 'tag' || c === 'tga') {
						c = randomCodon();
					}
					codons.push(c);
				}

				codons.push('taa');
				return codons.join('');
			}

			function getSequencePrefix() {
				const prefix = document.getElementById('prefix').value.trim();
				return prefix || 'sequence_';
			}

			function toCSV(sequences) {
				const prefix = getSequencePrefix();
				const lines = ['name,sequence'];
				for (let i = 0; i < sequences.length; i++) {
					lines.push(`${prefix}${i + 1},${sequences[i]}`);
				}
				return lines.join('\n');
			}

			function toFASTA(sequences) {
				const prefix = getSequencePrefix();
				const lines = [];
				for (let i = 0; i < sequences.length; i++) {
					lines.push(`>${prefix}${i + 1}`);
					lines.push(sequences[i]);
				}
				return lines.join('\n');
			}

			function downloadFile(content, filename, mimeType) {
				const blob = new Blob([content], { type: mimeType });
				const url = URL.createObjectURL(blob);
				const a = document.createElement('a');
				a.href = url;
				a.download = filename;
				document.body.appendChild(a);
				a.click();
				a.remove();
				URL.revokeObjectURL(url);
			}

			seqLengthInput.addEventListener('input', function () {
				validateSeqLength(this.value);
			});

			form.addEventListener('submit', function (e) {
				e.preventDefault();
				errorEl.textContent = '';

				const numSequences = Number(document.getElementById('numSequences').value);
				const seqLength = Number(document.getElementById('seqLength').value);
				const format = document.getElementById('format').value;
				const prefix = document.getElementById('prefix').value.trim();

				if (!Number.isInteger(numSequences) || numSequences < 1) {
					errorEl.textContent = 'Please enter a valid number of sequences (>= 1).';
					return;
				}

				if (!validateSeqLength(document.getElementById('seqLength').value)) {
					errorEl.textContent = 'Sequence length must be a multiple of 3. Minimum sequence length is 9.';
					return;
				}

				const sequences = [];
				for (let i = 0; i < numSequences; i++) {
					sequences.push(generateORF(seqLength));
				}

				if (format === 'csv') {
					downloadFile(toCSV(sequences), 'orf_sequences.csv', 'text/csv;charset=utf-8');
				} else {
					downloadFile(toFASTA(sequences), 'orf_sequences.fa', 'text/plain;charset=utf-8');
				}
			});
		})();
	</script>
</body>
</html>
